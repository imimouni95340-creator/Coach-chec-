name: Publier la PWA sur GitHub Pages

# Déclenchement MANUEL uniquement : publier rend l'application accessible
# publiquement sur Internet, c'est donc une décision explicite, jamais un effet
# de bord d'un push. Lancez-le depuis l'onglet Actions du dépôt, après avoir
# activé Pages (Settings > Pages > Source: GitHub Actions).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Tests unitaires
        run: npm test

      - name: Build (copie aussi le moteur Stockfish WASM)
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
