name: Publier la PWA sur GitHub Pages

# Publier rend l'application accessible publiquement sur Internet.
# Le propriétaire du dépôt l'a demandé explicitement : la publication est donc
# automatique à chaque push sur la branche de développement, et peut aussi être
# relancée à la main depuis l'onglet Actions.
on:
  push:
    branches:
      - claude/chess-coach-phase-1-etl2vc
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Tests unitaires
        run: npm test

      - name: Build (copie aussi le moteur Stockfish WASM)
        run: npm run build

      # Placé APRÈS les tests : un souci de configuration Pages ne doit pas
      # masquer le résultat du build.
      # `enablement: true` laisse le workflow activer Pages lui-même. Cela
      # échoue tant que le dépôt est privé sur un plan Free (Pages y est
      # indisponible) ; une fois le dépôt public, l'activation passe.
      - name: Configurer Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
