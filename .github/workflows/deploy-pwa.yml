name: Publier la PWA sur GitHub Pages

# Publie l'application sur GitHub Pages a chaque push, sans aucune action
# manuelle. Le site est servi depuis la branche gh-pages : c'est cette
# methode qui a pu etre activee, l'API Pages exigeant des droits
# d'administration qu'un jeton de workflow n'a pas.
on:
  push:
    branches:
      - claude/chess-coach-phase-1-etl2vc
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dependances
        working-directory: frontend
        run: npm ci

      - name: Tests unitaires
        working-directory: frontend
        run: npm test

      - name: Build (copie aussi le moteur Stockfish WASM)
        working-directory: frontend
        run: npm run build

      - name: Publier sur la branche gh-pages
        working-directory: frontend/dist
        run: |
          # .nojekyll : sinon Pages fait passer le site par Jekyll.
          touch .nojekyll
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" HEAD:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
